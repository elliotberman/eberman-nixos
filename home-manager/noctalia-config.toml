[bar.default]
center = [ "clock", "privacy" ]
end = [ "tray", "notifications", "network", "battery", "control-center", "session" ]
font_scale = 1.0999999828636646
margin_ends = 0
padding = 20
scale = 0.90000000596046448
shadow = false
start = [ "launcher", "workspaces" ]
thickness = 25

[battery]
warning_threshold = 25

[location]
auto_locate = true

[lockscreen]
grace_period_seconds = 5
transition = [ "zoom" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@WAYLAND-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1"]
    box_height = 196.0
    box_width = 280.0
    cx = 156.0
    cy = 150.0
    output = "WAYLAND-1"
    placement_height = 332.0
    placement_width = 312.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 807.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_password_reveal = true
        show_session_buttons = false
        show_unlock_hint = true
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 481.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        background_color = "primary"
        background_opacity = 0.55000000000000004
        clock_style = "digital"
        color = "on_primary"
        format = "{:%l:%M %p}"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 48.0
    box_width = 288.0
    cx = 963.5
    cy = 564.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        background_color = "secondary"
        background_opacity = 0.80000000000000004
        background_padding = 10
        background_radius = 12
        center_text = true
        circle = true
        clock_style = "digital"
        color = "on_secondary"
        font_family = ""
        format = "{:%a %B %d}"
        shadow = true
        show_seconds = true
        timezone = ""

[nightlight]
enabled = true

[plugins]
enabled = []

[shell]
clipboard_enabled = false

[shell.greeter_sync]
auto_sync = true

[shell.screenshot]
confirm_region = true

[theme]
builtin = "Eldritch"
mode = "auto"
source = "wallpaper"

[wallpaper.default]
path = "/nix/store/s6x85zlg0gd9h0gcnddr13ihglq11ksd-noctalia-5.4.1/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/nix/store/s6x85zlg0gd9h0gcnddr13ihglq11ksd-noctalia-5.4.1/share/noctalia/assets/noctalia-wallpaper.png"

[widget.clock]
format = "{:%a %b %d %l:%M %p}"

[widget.clock.actions]
left = "panel-toggle control-center"
